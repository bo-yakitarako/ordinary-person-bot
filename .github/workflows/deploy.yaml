name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: publish
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup mise (bun)
        uses: jdx/mise-action@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Write env keys
        run: echo "${{ secrets.ENV_KEYS }}" > env/.env.keys.production

      - name: Build
        run: bun run build

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add remote host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload build artifacts
        run: |
          rsync -avz dist/ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}":"${{ secrets.DEPLOY_PATH }}"

      - name: Deploy service
        run: |
          ssh "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" bash -s <<'EOF'
          set -e
          if [ -f ~/.config/systemd/user/ordinary-person-bot.service ]; then
            systemctl --user restart ordinary-person-bot
          else
            mkdir -p ~/.config/systemd/user
            cat > ~/.config/systemd/user/ordinary-person-bot.service <<'UNIT'
          [Unit]
          Description=ordinary-person-bot discord bot
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          WorkingDirectory=${{ secrets.DEPLOY_PATH }}
          ExecStart=mise run main
          Restart=on-failure
          RestartSec=5

          [Install]
          WantedBy=default.target
          UNIT
            systemctl --user daemon-reload
            systemctl --user start ordinary-person-bot
          fi
          EOF

      - name: Deploy once timers
        run: |
          ssh "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" bash -s <<'EOF'
          set -e
          mkdir -p ~/.config/systemd/user
          cat > ~/.config/systemd/user/ordinary-person-bot-saimaru.service <<'UNIT'
          [Unit]
          Description=ordinary-person-bot discord bot one shot script: saimaru

          [Service]
          Type=oneshot
          WorkingDirectory=${{ secrets.DEPLOY_PATH }}
          ExecStart=mise run saimaru

          [Install]
          WantedBy=default.target
          UNIT
          cat > ~/.config/systemd/user/ordinary-person-bot-saimaru.timer <<'UNIT'
          [Unit]
          Description=Timer for ordinary-person-bot discord bot one shot script: saimaru

          [Timer]
          OnCalendar=Sat 12:00
          Persistent=false

          [Install]
          WantedBy=timers.target
          UNIT
          cat > ~/.config/systemd/user/ordinary-person-bot-weekly.service <<'UNIT'
          [Unit]
          Description=ordinary-person-bot discord bot one shot script: weekly

          [Service]
          Type=oneshot
          WorkingDirectory=${{ secrets.DEPLOY_PATH }}
          ExecStart=mise run weekly

          [Install]
          WantedBy=default.target
          UNIT
          cat > ~/.config/systemd/user/ordinary-person-bot-weekly.timer <<'UNIT'
          [Unit]
          Description=Timer for ordinary-person-bot discord bot one shot script: weekly

          [Timer]
          OnCalendar=Sat 12:00
          Persistent=false

          [Install]
          WantedBy=timers.target
          UNIT
          systemctl --user daemon-reload
          systemctl --user enable --now ordinary-person-bot-saimaru.timer
          systemctl --user enable --now ordinary-person-bot-weekly.timer
          EOF
